@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#f2f3f6;--surface:#fff;--line:#d9dde5;--text:#12161d;--dim:#586172;--amber:#c47a0c;--ink:#fff;--good:#15803d}}
:root[data-theme="light"]{--bg:#f2f3f6;--surface:#fff;--line:#d9dde5;--text:#12161d;--dim:#586172;--amber:#c47a0c;--ink:#fff;--good:#15803d}
*{box-sizing:border-box;margin:0}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--text);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Hiragino Sans","PingFang SC",sans-serif;min-height:100dvh;padding:0 max(16px,env(safe-area-inset-right)) calc(92px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:calc(12px + env(safe-area-inset-top)) 0 10px;background:linear-gradient(var(--bg) 80%,transparent)}
header b{flex:1;white-space:nowrap;font-size:18px;font-weight:800;letter-spacing:-.01em}
select,.ib{height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:14px}
select{padding:0 10px;max-width:130px}
.ib{width:40px;display:grid;place-items:center;cursor:pointer;padding:0}
.ib svg{width:18px;height:18px}
#inst{width:auto;padding:0 12px;font-weight:700;color:var(--amber)}
h1{font-size:clamp(34px,10vw,48px);line-height:1;font-weight:900;letter-spacing:-.03em;margin:14px 0 6px}
#head{color:var(--dim);font-size:15px;margin-bottom:14px}
.chips{display:flex;gap:8px;margin-bottom:14px}
.chip{height:40px;padding:0 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--text);font:inherit;font-size:15px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--ink)}
.list{display:grid;gap:10px}
.card{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:14px 14px 14px 16px;border:1px solid var(--line);border-radius:20px;background:var(--surface)}
.card b{display:block;font-size:19px;line-height:1.2;letter-spacing:-.01em}
.card small{display:block;margin-top:3px;color:var(--dim);font-size:14px}
.pill{justify-self:start;padding:3px 10px;border-radius:999px;font-size:13px;font-weight:800;background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.pill.live{background:color-mix(in srgb,var(--good) 20%,transparent);color:var(--good)}
.go{grid-column:2;grid-row:1/span 2;display:grid;place-items:center;min-width:68px;height:52px;padding:0 16px;border-radius:16px;background:var(--amber);color:var(--ink);font-weight:900;font-size:17px;text-decoration:none}
.lnk{grid-column:1;font-size:13px;color:var(--dim)}
.note{margin:18px 0 0;color:var(--dim);font-size:13px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:10px;padding:10px max(16px,env(safe-area-inset-right)) calc(10px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line)}
nav button{flex:1;max-width:300px;height:56px;border-radius:18px;border:0;background:transparent;color:var(--dim);font:inherit;font-size:16px;font-weight:800;cursor:pointer}
nav button i{font-style:normal}
nav button span{display:block;font-size:20px;line-height:1.1}
nav button[aria-pressed="true"]{background:color-mix(in srgb,var(--amber) 20%,transparent);color:var(--amber)}
:focus-visible{outline:2px solid var(--amber);outline-offset:2px}

async function loadTR(l){if(l==='en'||TR[l])return;try{const b=Uint8Array.from(atob(TRZ[l]),c=>c.charCodeAt(0));TR[l]=await new Response(new Blob([b]).stream().pipeThrough(new DecompressionStream('gzip'))).json()}catch(e){TR[l]={}}}
const t=(k,...a)=>{let s=(LANG!=='en'&&TR[LANG]&&TR[LANG][k]!==undefined)?TR[LANG][k]:k;a.forEach((v,i)=>s=s.replace('{'+i+'}',v));return s};

function pragueNow(){
  try{
    const z='Europe/Prague',d=new Date();
    const dn=new Intl.DateTimeFormat('en-US',{timeZone:z,weekday:'long'}).format(d);
    const p=new Intl.DateTimeFormat('en-GB',{timeZone:z,hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(d);
    const g=x=>+p.find(y=>y.type===x).value;
    return {day:Math.max(0,DAYEN.indexOf(dn)),min:g('hour')*60+g('minute')};
  }catch(e){const d=new Date();return {day:(d.getDay()+6)%7,min:d.getHours()*60+d.getMinutes()}}
}

const kc=n=>new Intl.NumberFormat(({cs:'cs-CZ',pt:'pt-PT',it:'it-IT',fr:'fr-FR',es:'es-ES',ru:'ru-RU',de:'de-DE',ja:'ja-JP',zh:'zh-CN'})[LANG]||'en-US').format(n)+'\u00a0Kč';
const hm=m=>String(Math.floor(m/60)%24).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
function state(v){
  const n=pragueNow();
  for(const w of v.w){const e=wEnd(w);if(w.d.includes((n.day+6)%7)&&e>1440&&n.min<e-1440)return{live:1,until:e-1440,x:w.x}}
  let best=null;
  for(let o=0;o<=7;o++){const dd=(n.day+o)%7;for(const w of v.w){if(!w.d.includes(dd))continue;const f=tm(w.f),e=wEnd(w),s=o*1440+f;
    if(o===0&&n.min>=f&&n.min<e)return{live:1,until:e%1440,x:w.x};
    if(s>n.min&&(!best||s<best.s))best={s,o,f:w.f,x:w.x,day:dd}}}
  return best;
}
function render(){
  document.documentElement.lang=LANG;
  $('lang').value=LANG;$('lang').setAttribute('aria-label',t('Language'));
  $('n1').textContent=t('Happy hour');$('n2').textContent=t('Clubs');
  document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===TAB));
  $('h1').textContent=t('Where to tonight?');
  $('inst').textContent=t('Install');
  const ch=document.querySelectorAll('.chip');ch[0].textContent=t('All');ch[1].textContent=t('On now');ch.forEach(c=>c.setAttribute('aria-pressed',c.dataset.f===FIL));
  $('chips').hidden=TAB!=='hh';
  if(TAB==='cl'){
    $('head').textContent=t(CK);
    $('list').innerHTML=clubs.map(c=>`<div class="card"><div><b>${c.n}</b><small>${t(c.note)}</small></div><span class="pill">${c.cover?(c.cover[0]===c.cover[1]?kc(c.cover[0]):c.cover[0]+'–'+kc(c.cover[1])):t('Cover not listed')}</span><a class="go" href="${gm(c.q)}" target="_blank" rel="noopener">${t('Go')}</a>${c.site?`<a class="lnk" href="${c.site}" target="_blank" rel="noopener">${c.site.replace(/^https?:\/\/|\/$/g,'')}</a>`:''}</div>`).join('');
    $('note').textContent='';return;
  }
  const L=hh.filter(v=>!v.warn).map(v=>({v,s:state(v)})).filter(x=>x.s);
  L.sort((a,b)=>(b.s.live?1:0)-(a.s.live?1:0)||(a.s.live?((a.v.p??999)-(b.v.p??999)):(a.s.s-b.s.s)));
  const live=L.filter(x=>x.s.live);
  $('head').textContent=live.length?t('On right now')+' · '+live.length:t('Nothing is running right now. These start next.');
  const D=DAYSL[LANG],shown=FIL==='now'?live:L.slice(0,Math.max(live.length,12));
  $('list').innerHTML=shown.map(({v,s})=>{
    const when=s.live?t('On now until {0}',hm(s.until)):t('Starts {0}',s.o===0?s.f:(s.o===1?t('Tomorrow')+' '+s.f:D[s.day]+' '+s.f));
    return `<div class="card"><div><b>${v.n}</b><small>${t(s.x)} · ${v.a}</small></div><span class="pill${s.live?' live':''}">${when}</span><a class="go" href="${gm(v.n+', '+v.ad+', Praha')}" target="_blank" rel="noopener">${t('Go')}</a></div>`}).join('');
  $('note').textContent=t('Times come from public listings. Confirm with the venue before you go.');
}
